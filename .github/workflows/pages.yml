name: Publicar bitácora

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en el enlace de la bitácora
        type: boolean
        default: true

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener las ediciones anteriores
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Obtener los paquetes web de 0.3 a 0.7
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: publicacion-0-7
          path: .susurros-release
          persist-credentials: false
      - name: Preparar la publicación
        shell: bash
        run: |
          site="$RUNNER_TEMP/susurros-site"
          mkdir "$site"
          git archive HEAD -- .nojekyll index.html v0.1 v0.2 | tar -xf - -C "$site"
          git -C .susurros-release archive HEAD -- v0.3 v0.4 v0.5 v0.6 v0.7 | tar -xf - -C "$site"
          for version in v0.3 v0.4 v0.5 v0.6 v0.7; do
            edition="$site/$version"
            test -s "$edition/index.html"
            test -s "$edition/app.js"
            test -s "$edition/places.json"
            test -s "$edition/media/colombia-outline.json"
            test -s "$edition/media/cotero-logo.png"
            test ! -e "$edition/data.json"
            test "$(find "$edition" -name '*.js' -type f | wc -l)" -eq 1
            test -z "$(find "$edition" -name '*.map' -type f -print -quit)"
            node --check "$edition/app.js"
          done
          test -d "$site/v0.3/media/corte/web"
          test -d "$site/v0.4/media/corte/web"
          test -n "$(find "$site/v0.4/media/corte/mix" -type f -name '*.mp3' -size +0c -print -quit)"
          for version in v0.5 v0.6 v0.7; do
            test -s "$site/$version/opening.css"
            test -s "$site/$version/media/minculturas-logo.png"
          done
      - name: Preparar paquete para GitHub Pages
        if: inputs.publish
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/susurros-site
          retention-days: 1

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
